<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>回収等履歴管理システム「取りもれ～ぬ」Ver173</title>

<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  // Ver189.5.7: 呼び出し処理を妨げない非同期トレース
  function fireAudioTrace_(stage, callId, detail, payload){
    try{
      Promise.resolve(
        sendAudioTrace_(
          String(stage || ''),
          String(callId || ''),
          String(detail || ''),
          payload || {}
        )
      ).catch(error => {
        try{ console.warn('[ASYNC_AUDIO_TRACE_FAILED]', stage, error); }catch(_e){}
      });
    }catch(error){
      try{ console.warn('[ASYNC_AUDIO_TRACE_THROW]', stage, error); }catch(_e){}
    }
  }

</script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>

<style>
  html,body{height:100%;margin:0;-webkit-text-size-adjust:100%}
  body,button{touch-action:manipulation;}
  #map{position:absolute;inset:0;z-index:0}

  .panel{
    position:absolute;left:8px;top:8px;z-index:1000;
    background:rgba(255,255,255,.97);
    border:1px solid #ddd;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);
    padding:10px;width:min(400px,92vw);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;
    box-sizing:border-box;
    max-height:calc(100dvh - 24px); /* Ver156: 下部のVer表記が隠れにくいようにする */
    overflow-y:auto;
    padding-bottom:22px;
  }
  .panel h2{font-size:16px;margin:0 0 6px}
  .panel-title{display:flex;align-items:center;gap:6px;}
  .panel-title .title-left{display:flex;align-items:center;min-width:0;white-space:nowrap;}
  #btnMyDriveSync{margin-left:auto;width:auto;padding:5px 8px;border-radius:8px;font-size:12px;line-height:1.2;background:#dcfce7;border:1px solid #86efac;color:#14532d;}
  #gasSyncStatus{font-size:12px;color:#14532d;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:4px 6px;margin:3px 0 6px;display:none;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
  .row>*{width:100%}
  .controls{display:grid;gap:4px}
  label{font-size:12px;color:#333;display:block}
  select,input[type="text"],input[type="file"],button{
    padding:8px;border-radius:8px;border:1px solid #ccc;font-size:14px;box-sizing:border-box;
    max-width:100%;width:100%;
  }
  input[type="file"]{background:#fff}
  .file-wrap{background:#f7f0b8;border:1px solid #ccc;border-radius:8px;padding:6px}
  .file-wrap input[type="file"]{display:block;width:100%;max-width:100%}
  button.primary{background:#2563eb;color:#fff;border:none}
  button.warn{background:#f59e0b;color:#111;border:none}
  button.ghost{background:#fff}
  .small{font-size:12px;color:#555}
  #legendLine{margin-top:-2px!important;line-height:1.25;padding-bottom:12px;}
  .pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#eee;font-size:12px;margin-left:6px}
  .err{position:absolute;top:0;left:0;right:0;background:#fee;color:#900;padding:8px 10px;font-size:12px;z-index:2000;border-bottom:1px solid #f99;display:none}

  #btnPanel{
    position:absolute;right:10px;top:10px;z-index:1100;
    background:#fff;border:1px solid #ccc;border-radius:20px;padding:16px 10px;font-size:14px;
    display:inline-block;width:auto;
    transform:none; /* Ver156: 音量ボタン下に隠れないよう右側へ移動 */
  }
  .volbox{
    position:absolute;right:86px;top:10px;z-index:1100;display:flex;gap:6px
  }
  .volbox button{background:#fff;border:1px solid #ccc;border-radius:8px;padding:6px 8px;font-size:14px;width:auto}
  /* Ver173: Androidタブレットで左側パネルと重ならないよう、読上げボタン群の描写開始位置を約7mm右へ調整 */
  .course-readbox{
    position:absolute;right:2px;bottom:70px;z-index:1100;
    display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:center;
    width:min(194px, calc(100vw - 20px));
    font-family:system-ui,-apple-system,Segoe UI,Roboto,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;
  }
  #btnCourseRead{grid-column:1 / 3;}
  #btnCourseReadFromStart{grid-column:1 / 3;}
  .course-readbox button{
    background:#fff;border:1px solid #ccc;border-radius:8px;padding:6px 8px;font-size:12px;width:100%;
    box-shadow:0 1px 4px rgba(0,0,0,.08);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  #courseReadStatus{
    position:absolute;right:2px;bottom:38px;z-index:1100;
    background:rgba(255,255,255,.92);border:1px solid #ddd;border-radius:8px;
    padding:3px 7px;font-size:11px;color:#444;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,'Hiragino Kaku Gothic ProN',Meiryo,sans-serif;
  }
  @media (max-width: 700px){
    .course-readbox{right:2px;bottom:70px;width:min(194px, calc(100vw - 20px));}
    #courseReadStatus{right:2px;bottom:38px;}
  }

  /* Ver173: 手動回収ボタン位置を再調整
     - コース一覧読上げボタンの位置は変更しない
     - 無回収ボタンはVer170の描写開始位置から上方向へ約5mm相当
     - 回収ボタンはVer170の描写開始位置から上方向へ約9mm相当
     ※ Android 7インチ実測に合わせ、重なり防止のため上下間隔も確保 */
  .fab{
    position:fixed;right:16px;bottom:233px;z-index:1500;
    background:#ef4444;color:#fff;border:none;border-radius:9999px;
    padding:14px 18px;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.18);display:none;width:auto
  }
  .fab-small{
    position:fixed;right:16px;bottom:178px;z-index:1500;
    background:#f59e0b;color:#111;border:none;border-radius:9999px;
    padding:12px 16px;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.18);display:none;width:auto
  }

  #toast{
    position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
    background:rgba(0,0,0,.85);color:#fff;padding:12px 16px;border-radius:10px;
    font-size:14px;z-index:2000;display:none;max-width:90vw;text-align:center;
  }

  .leaflet-control-zoom{font-size:28px}
  .leaflet-control-zoom a{width:52px;height:52px;line-height:52px;font-size:28px}

  #csvOverlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    z-index:3000; display:none; align-items:center; justify-content:center;
  }
  #csvPanel{
    width:min(920px, 94vw); height:min(80vh, 720px);
    background:#fff; color:#111; border-radius:12px; overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.35); display:flex; flex-direction:column;
  }
  #csvHead{ padding:10px; border-bottom:1px solid #e5e7eb; background:#f7f7f8; }
  #csvHead .row{ display:flex; gap:8px; flex-wrap:wrap }
  #csvHead h1{ font-size:16px; margin:0 0 6px }
  #csvHead .btn{ appearance:none; border:0; border-radius:10px; padding:10px 14px; font-size:14px }
  #csvHead .btn-primary{ background:#2563eb; color:#fff }
  #csvHead .btn-share{ background:#10b981; color:#fff }
  #csvHead .btn-ghost{ background:#fff; border:1px solid #d1d5db; color:#111 }
  #csvHead .hint{ font-size:12px; color:#555; margin-top:6px }
  #csvBody{ flex:1; overflow:auto; }
  #csvBody pre{ margin:0; padding:12px; white-space:pre; font:12px/1.5 ui-monospace,Menlo,Consolas,monospace }

  #resumeOverlay{
    position:fixed; inset:0; background:rgba(0,0,0,.45);
    z-index:3100; display:none; align-items:center; justify-content:center;
  }
  #resumePanel{
    width:min(420px, 92vw);
    background:#fff;color:#111;border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,.35);
    padding:16px;box-sizing:border-box;
  }
  #resumePanel h1{font-size:16px;margin:0 0 10px;}
  #resumePanel p{font-size:13px;margin:0 0 10px;}
  #resumePanel select{width:100%;margin:8px 0 12px;}
  #resumePanel .row{margin-top:8px;}

  .blink-white{
    filter: brightness(210%) saturate(0%) contrast(220%);
    will-change: filter;
    transition: filter 50ms linear;
  }

  .link-sv{
    display:inline-block;margin-top:6px;background:#10b981;color:#fff;
    padding:6px 10px;border-radius:8px;text-decoration:none;font-size:12px
  }

  /* ===== Ver173: ホバーツールチップ（PC用：マウスオーバー時にName表示） =====
     Ver157では marker の img 要素内に div を追加していたため、環境によって表示されないことがあった。
     Ver173でも Leaflet 標準の bindTooltip を使用し、マウスを近づけるとアイコン上部へ確実に表示する。 */
  .leaflet-tooltip.marker-name-tooltip-v159{
    background:rgba(30,30,30,.92);
    color:#fff;
    border:0;
    border-radius:6px;
    box-shadow:0 2px 6px rgba(0,0,0,.25);
    font-size:12px;
    font-weight:bold;
    line-height:1.3;
    padding:3px 9px;
    white-space:nowrap;
    pointer-events:none;
  }
  .leaflet-tooltip-top.marker-name-tooltip-v159::before{
    border-top-color:rgba(30,30,30,.92);
  }

  .car-icon{ background: transparent !important; border: 0 !important; }
  .car-icon .car-arrow{
    width:64px;height:64px;border-radius:50%;
    border:4px solid #e11d48;
    background:#ffffff;
    position:relative;
    box-sizing:border-box;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
    transform:rotate(0deg);
    transform-origin:50% 50%;
    transition:transform .18s linear;
  }
  .car-icon .car-arrow-inner{
    position:absolute;
    left:50%;top:50%;
    transform:translate(-50%,-60%);
    width:0;height:0;
    border-style:solid;
    border-width:0 12px 24px 12px;
    border-color:transparent transparent #e11d48 transparent;
    animation:arrowBlink 1s infinite;
  }
  @keyframes arrowBlink{
    0%,100%{ border-bottom-color:#e11d48; }
    50%    { border-bottom-color:#ffffff; }
  }
</style>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(function(registrations) {
    for (let registration of registrations) {
      registration.unregister();
    }
  });
}
</script>
</head>

<body>
<div id="map"></div>
<div id="err" class="err"></div>
<div id="toast"></div>

<button id="btnFabCollect" class="fab">回収（選択 0）</button>
<button id="btnFabSkip" class="fab-small">無回収（選択→黄）</button>

<button id="btnPanel" title="設定の表示/非表示">設定</button>
<div class="volbox">
  <button id="volDown">音量-</button>
  <button id="volUp">音量+</button>
</div>
<div class="course-readbox" id="courseReadBox">
  <button id="btnCourseRead" title="実車：無効のとき、現在のコースを順番に読み上げます。停止後は続きから再開します。">コース一覧読上げ</button>
  <button id="btnCourseReadFromStart" title="停止位置に関係なく、コースの最初から読み上げます。">コース読み上げ(最初から)</button>
  <button id="btnReadSlower" title="読み上げ間隔を長くします">▽</button>
  <button id="btnReadFaster" title="読み上げ間隔を短くします">△</button>
</div>
<div id="courseReadStatus">読上げ間隔：3.0秒</div>

<div class="panel" id="panel">
  <h2 class="panel-title">
    <span class="title-left">回収結果数 <span class="pill" id="pointCount">0 箇所(赤0/黄0)</span></span>
    <button id="btnMyDriveSync" type="button" title="Google Driveフォルダを開きます。データ読込は従来どおり各ファイル選択ボタンで行います">MyDrive同期</button>
  </h2>
  <div id="gasSyncStatus"></div>

  <div class="controls">
    <div class="row">
      <div><label>車両ID<select id="vehicle"></select></label></div>
      <div><label>運転者<select id="driver"></select></label></div>
    </div>

    <div>
      <label>地点CSV読込（Name,Latitude,Longitude,Description,Note,Speak）</label>
      <div class="file-wrap"><input type="file" id="file" accept=".csv,.kml,.geojson,.json"></div>
      <div class="small">CSV推奨。KML/GeoJSONは簡易対応（ポイントのみ）。</div>
    </div>

    <div>
      <label>基本回収ルート読込（.gpx / .xml / .geojson / .json / .csv）</label>
      <div class="file-wrap">
        <input type="file" id="fileRoute"
               accept=".gpx,.xml,.geojson,.json,.csv,application/gpx+xml,application/xml,text/xml,text/plain,*/*">
      </div>
      <div class="row" style="grid-template-columns:1fr 1fr">
        <button id="btnRouteZoom" class="ghost" style="font-size:12px">ルートへズームアウト</button>
        <button id="btnHeading" class="ghost" style="font-size:12px">ヘディング：OFF</button>
      </div>
    </div>

    <div>
      <label>例外到着CSV読込（Place,DeviceLat,DeviceLon）</label>
      <div class="file-wrap"><input type="file" id="fileException" accept=".csv"></div>
      <div class="small">例外地点は <b>20m以内</b> で回収済として扱います。</div>
    </div>

    <div class="row">
      <label>近接しきい値(m)
        <input type="text" id="thres" value="25" inputmode="numeric" autocomplete="off">
      </label>
      <label>到着判定(m)
        <input type="text" id="arrive" value="15" inputmode="numeric" autocomplete="off">
      </label>
    </div>

    <div class="row" style="align-items:end">
      <label>遠距離オートズーム(m)
        <input type="text" id="farZoom" value="100" inputmode="numeric" autocomplete="off">
      </label>
      <div style="display:flex;align-items:end;">
        <button id="btnClearAll" class="ghost" style="width:100%;">回収地点全クリア</button>
      </div>
    </div>

    <div class="row" style="grid-template-columns:1fr 1fr 1fr 1fr">
      <button id="btnNavStart" class="primary">ナビ開始</button>
      <button id="btnNavStop" class="ghost">一時停止</button>
      <button id="btnNavResume" class="ghost">再開</button>
      <button id="btnPosFix" class="ghost">補正</button>
    </div>

    <div class="row">
      <button id="btnDownload" class="warn">CSVダウンロード</button>
      <button id="btnPreview" class="ghost">CSV表示</button>
    </div>

    <div class="row">
      <button id="btnRealToggle" class="ghost" title="実車の有効/無効を切り替えます">実車：無効</button>
      <button id="btnAudioStandby" class="ghost">音声待受：OFF</button>
      <button id="btnLabelToggle" class="ghost" title="地理院『標準地図の注記』重ね合わせのON/OFF">注記：ON</button>
    </div>


    <div id="legendLine" class="small" style="margin-top:6px;">
      <span style="color:#111;">地図上回収場所の色：回収済「赤」 / 無回収「黄」 / 回収漏れ（未操作）「青」</span>
      <span id="legendVer" style="color:#c00; margin-left:6px;">Ver173</span>
    </div>
  </div>
</div>

<div id="csvOverlay" aria-modal="true" role="dialog">
  <div id="csvPanel">
    <div id="csvHead">
      <h1>CSVプレビュー</h1>
      <div class="row">
        <button id="csvBtnDownload" class="btn btn-primary">このCSVをダウンロード</button>
        <button id="csvBtnShare" class="btn btn-share">“ファイル”に保存 / 共有</button>
        <button id="csvBtnClose" class="btn btn-ghost">閉じる</button>
      </div>
      <div class="hint">
        iPhone はダウンロード後に “ファイル”アプリ → ダウンロード で確認できます。
      </div>
    </div>
    <div id="csvBody"><pre id="csvPre"></pre></div>
  </div>
</div>

<div id="resumeOverlay" aria-modal="true" role="dialog">
  <div id="resumePanel">
    <h1>再開地点の選択</h1>
    <p>再開したい回収地点名を選択してください。</p>
    <select id="resumeSelect"></select>
    <div class="row" style="grid-template-columns:1fr 1fr">
      <button id="resumeOk" class="primary">この地点から再開</button>
      <button id="resumeCancel" class="ghost">キャンセル</button>
    </div>
  </div>
</div>

<script>
(function(){
  const VERSION = 'Ver189.5.7';
  document.title = `回収等履歴管理システム「取りもれ～ぬ」${VERSION}`;
  const legendVerEl = document.getElementById('legendVer');
  if(legendVerEl) legendVerEl.textContent = VERSION;

  const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxA4Pxg2gVcWz8TWL680zJ7bBGh4K9CcBox2kmZBGrWlXBNsfdTb79eOQGvOBIGURfNlg/exec';

  // Ver174: センター監視用ハートビート
  const HEARTBEAT_INTERVAL_MS = 60 * 1000;
  const HEARTBEAT_DEVICE_ID_KEY = 'torimorenuHeartbeatDeviceId';
  const HEARTBEAT_LAST_PLACE_KEY = 'torimorenuHeartbeatLastPlace';
  const HEARTBEAT_LAST_COLLECTION_TIME_KEY = 'torimorenuHeartbeatLastCollectionTime';
  const HEARTBEAT_LAST_RESULT_KEY = 'torimorenuHeartbeatLastResult';

  // Ver180: docomo dtab 1台限定・遠隔操作テスト
  const REMOTE_COMMAND_POLL_INTERVAL_MS = 10 * 1000;
  const AUDIO_CALL_POLL_INTERVAL_MS = 3000;
  const AUDIO_STANDBY_KEY = 'torimorenuAudioStandbyEnabled';

  // Ver189.3：大音量呼出・音声検知自動応答
  const AUDIO_RING_TIMEOUT_MS = 35000;
  const AUDIO_RING_ON_MS = 1500;
  const AUDIO_LISTEN_MS = 1400;
  const AUDIO_VOICE_FRAME_MS = 100;
  const AUDIO_VOICE_REQUIRED_FRAMES = 4;
  const AUDIO_MIN_VOICE_RMS = 0.028;
  const AUDIO_ICE_SERVERS = [
    {urls:'stun:stun.l.google.com:19302'},
    {urls:'stun:stun1.l.google.com:19302'}
  ];
  const REMOTE_COMMAND_LAST_ID_KEY = 'torimorenuRemoteCommandLastId';

  // Ver156: 回収結果はGAS経由でGoogleスプレッドシート「collection_results_data」に一元保存します。
  // GAS_ENDPOINT は collection_results_receiver_GAS_v5.gs のWebアプリURLを設定済みです。
  // 未設定でも従来どおり端末内localStorageには一時保存されます。
  const MYDRIVE_FOLDER_URL = 'https://drive.google.com/drive/folders/13ClA6ZaIiCtGrXbfLXbRcsRTYB1z94q4';
  const POINTS_DRIVE_FOLDER_URL = 'https://drive.google.com/drive/folders/13ClA6ZaIiCtGrXbfLXbRcsRTYB1z94q4';
  const ROUTE_DRIVE_FOLDER_URL  = 'https://drive.google.com/drive/folders/1947oZh4-7rXJvrq0pYl17-TFwryTnL9O';

  async function sendRowToServer(payload){
    if(!GAS_ENDPOINT || !GAS_ENDPOINT.startsWith('https://')){
      console.warn('GAS_ENDPOINT未設定のため、端末内に未送信保存します。');
      throw new Error('GAS_ENDPOINT未設定');
    }

    // Ver156:
    // 取りもれーぬ側は fetch + no-cors でGASへPOSTします。
    // 電波圏外や送信失敗時は pushLogRow 側で pendingRows に保存されます。
    await fetch(GAS_ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });

    // no-corsではGASからのJSON本文を読めないため、送信完了扱いで返します。
    return {ok:true, mode:'no-cors'};
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

  function init(){
  const AUTO_COLLECT_M = 10;
  const EXCEPTION_M    = 20;
  const POPUP_STAY_UNTIL_M = 10;
  const SUPPRESS_MS = 2000;
  const RESUME_AUTO_CLOSE_MS = 30000;

  function showErr(e){
    const el=document.getElementById('err');
    el.textContent='Error: '+(e&&e.message?e.message:e);
    el.style.display='block';
    console.error(e);
  }
  function showToast(msg, seconds=2){
    const t=document.getElementById('toast');
    t.textContent=msg; t.style.display='block';
    clearTimeout(showToast._timer);
    showToast._timer=setTimeout(()=>{ t.style.display='none'; }, seconds*1000);
  }
  window.addEventListener('error',ev=>showErr(ev.error||ev.message||'unknown'));

  const panel=document.getElementById('panel');
  const btnPanel=document.getElementById('btnPanel');
  let panelVisible=true;
  let suppressFollowUntil=0;
  function suppressFollow(ms = SUPPRESS_MS){
    suppressFollowUntil = Math.max(suppressFollowUntil, Date.now() + ms);
  }
  function togglePanel(force){
    if(typeof force==='boolean'){ panelVisible=force; } else { panelVisible=!panelVisible; }
    panel.style.display=panelVisible?'block':'none';
    if(!panelVisible){ blurAllInputs(); }
  }
  btnPanel.addEventListener('click',()=>{ suppressFollow(); togglePanel(); });
  document.getElementById('btnMyDriveSync').addEventListener('click', syncMyDriveFromGas);

  // =====================================================
  // Ver174 ハートビート（生存監視）
  // =====================================================
  let heartbeatTimer = null;
  let heartbeatSending = false;
  let heartbeatLastSentAt = 0;

  async function getBatterySnapshot(){
    try{
      if(!navigator.getBattery) return {level:'', charging:''};
      const battery = await navigator.getBattery();
      return {
        level: Number.isFinite(Number(battery.level))
          ? Math.round(Number(battery.level) * 100)
          : '',
        charging: typeof battery.charging === 'boolean'
          ? battery.charging
          : ''
      };
    }catch(_e){
      return {level:'', charging:''};
    }
  }

  function isValidHeartbeatCoordinate(lat, lon){
    const la = Number(lat);
    const lo = Number(lon);
    if(!Number.isFinite(la) || !Number.isFinite(lo)) return false;
    if(Math.abs(la) > 90 || Math.abs(lo) > 180) return false;
    // 未初期化値として入りやすい 0,0 は送らない
    if(la === 0 && lo === 0) return false;
    return true;
  }

  async function getHeartbeatLatLon(){
    // 1. 地図上の現在地マーカーを最優先
    try{
      const quick = getLatLngFromLocMarker();
      if(Array.isArray(quick) && quick.length >= 2 &&
         isValidHeartbeatCoordinate(quick[0], quick[1])){
        return {
          lat:Number(quick[0]),
          lon:Number(quick[1]),
          source:'location-marker'
        };
      }
    }catch(e){
      console.warn('現在地マーカーの参照に失敗しました。', e);
    }

    // 2. アプリ内で保持している直近GPSを利用
    if(isValidHeartbeatCoordinate(lastGpsLat, lastGpsLon)){
      return {
        lat:Number(lastGpsLat),
        lon:Number(lastGpsLon),
        source:'cached-gps'
      };
    }

    // 3. Ver175.1: ハートビート自身が現在位置を直接取得
    //    ナビ開始・実車モードの状態には依存しない
    try{
      const latest = await getCurrentLatLng(8000);
      if(Array.isArray(latest) && latest.length >= 2 &&
         isValidHeartbeatCoordinate(latest[0], latest[1])){
        return {
          lat:Number(latest[0]),
          lon:Number(latest[1]),
          accuracy:Number.isFinite(Number(latest[2]))
            ? Number(latest[2])
            : '',
          source:'heartbeat-geolocation'
        };
      }
    }catch(e){
      // GPS取得失敗でもハートビートと通常回収は止めない
      console.warn('ハートビート独立GPS取得に失敗しました。', e);
    }

    return {lat:'', lon:'', accuracy:'', source:'unavailable'};
  }

  // Ver182: センター運行管理用データ
  function buildCenterPointSnapshot(){
    const order=strictOrder.length?strictOrder.slice():points.map(p=>p.name);
    return order.map((name,index)=>{
      const p=nameIndex.get(name); if(!p) return null;
      return {seq:index+1,name:String(p.name||''),lat:Number(p.lat),lon:Number(p.lon),status:String(p.status||'normal'),note:String(p.note||'').substring(0,120)};
    }).filter(x=>x&&Number.isFinite(x.lat)&&Number.isFinite(x.lon)).slice(0,500);
  }

  function buildCenterRouteSnapshot(){
    const source=Array.isArray(routeLatLngs)?routeLatLngs:[];
    if(source.length<2) return [];
    const maxPoints=500;
    if(source.length<=maxPoints) return source.map(v=>[Number(v[0]),Number(v[1])]).filter(v=>Number.isFinite(v[0])&&Number.isFinite(v[1]));
    const result=[],step=(source.length-1)/(maxPoints-1);
    for(let i=0;i<maxPoints;i++){ const v=source[Math.min(source.length-1,Math.round(i*step))]; const lat=Number(v&&v[0]),lon=Number(v&&v[1]); if(Number.isFinite(lat)&&Number.isFinite(lon)) result.push([lat,lon]); }
    return result;
  }

  async function makeHeartbeatPayload(reason){
    const battery = await getBatterySnapshot();
    const pos = await getHeartbeatLatLon();
    const vehicle = vehicleSel ? String(vehicleSel.value || '') : '';
    const driver = driverSel ? String(driverSel.value || '') : '';

    return {
      payloadType: 'heartbeat',
      heartbeatVersion: 'Ver1',
      appVersion: VERSION,
      deviceId: getHeartbeatDeviceId(),
      deviceTime: nowStamp(),
      vehicle: vehicle,
      driver: driver,
      courseName: currentCourseName || '',
      lastPlace: getHeartbeatLastPlace(),
      lastCollectionTime: getHeartbeatLastCollectionTime(),

      // Ver180.2: dtab側と同じ再開候補をセンターへ送信
      routeOptionsJson: JSON.stringify(buildResumeOptions()),
      suggestedResumeSeq: (function(){
        const maxSeq = getMaxCollectedSeq();
        if(maxSeq > 0 && maxSeq < strictOrder.length) return maxSeq + 1;
        return strictOrder.length > 0 ? 1 : '';
      })(),
      centerPointsJson: JSON.stringify(buildCenterPointSnapshot()),
      centerRouteJson: JSON.stringify(buildCenterRouteSnapshot()),
      lastResultType: getHeartbeatLastResult(),
      lat: pos.lat,
      lon: pos.lon,
      gpsAccuracy: pos.accuracy ?? '',
      gpsSource: pos.source || '',
      batteryLevel: battery.level,

      visibilityState: document.visibilityState || '',
      realMode: !!realMode,
      pendingCount: Array.isArray(pendingRows) ? pendingRows.length : 0,
      reason: String(reason || 'interval'),
      userAgent: navigator.userAgent || '',
      pageUrl: location.href || ''
    };
  }

  async function sendHeartbeat(reason, force){
    if(heartbeatSending) return;
    if(!GAS_ENDPOINT || !GAS_ENDPOINT.startsWith('https://')) return;

    const now = Date.now();
    if(!force && (now - heartbeatLastSentAt) < 15000) return;

    heartbeatSending = true;
    try{
      const payload = await makeHeartbeatPayload(reason);
      await fetch(GAS_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(payload)
      });
      heartbeatLastSentAt = Date.now();
      console.log('ハートビート送信:', payload.reason, payload.vehicle, payload.lastPlace);
    }catch(e){
      // ハートビート失敗では回収処理を止めない
      console.warn('ハートビート送信失敗:', e);
    }finally{
      heartbeatSending = false;
    }
  }

  function normalizeSpeakText(s){
    s = String(s ?? '');
    s = s.replace(/\u3000/g, ' ');
    s = s.replace(/[－??\-]/g, ' の ');
    s = s.replace(/([一-龠ぁ-ヴァ-ヴー])(\d)/g, '$1 $2');
    s = s.replace(/(\d)([一-龠ぁ-ヴァ-ヴー])/g, '$1 $2');
    s = s.replace(/[{}[\]]/g, ' ');
    s = s.replace(/\s+/g, ' ').trim();
    return s;
  }

  function pickJaVoice(){
    try{
      const vs = speechSynthesis.getVoices ? speechSynthesis.getVoices() : [];
      if(!vs || !vs.length) return null;
      const ja = vs.filter(v=>/^ja/i.test(v.lang||''));
      if(ja.length){
        const prefer = ja.find(v=>/Kyoko|Otoya|Google 日本語|Japanese/i.test(v.name||''));
        return prefer || ja[0];
      }
      return null;
    }catch(_e){
      return null;
    }
  }

  function makeUtterance(t){
    const u=new SpeechSynthesisUtterance(normalizeSpeakText(t));
    u.lang='ja-JP'; u.rate=1.0;
    const v = pickJaVoice();
    if(v) u.voice = v;
    return u;
  }

  function speakSafe(t){
    if(!t) return;
    try{
      unlockAll();
      if (speechSynthesis.speaking) speechSynthesis.cancel();
      speechSynthesis.speak(makeUtterance(t));
    }catch(e){
      console.warn('音声再生に失敗:', e);
    }
  }

  function speakSafeAsync(t){
    return new Promise(resolve=>{
      if(!t){ resolve(); return; }
      try{
        unlockAll();
        if (speechSynthesis.speaking) speechSynthesis.cancel();
        const u = makeUtterance(t);
        let done=false;
        const finish=()=>{ if(done) return; done=true; resolve(); };
        u.onend=finish;
        u.onerror=finish;
        speechSynthesis.speak(u);
        setTimeout(finish, Math.max(3500, normalizeSpeakText(t).length * 180));
      }catch(e){
        console.warn('音声再生に失敗:', e);
        resolve();
      }
    });
  }

  function normalizeDeg(deg){
    deg = Number(deg);
    if(!Number.isFinite(deg)) return null;
    deg = deg % 360;
    if(deg < 0) deg += 360;
    return deg;
  }
  function bearingDeg(lat1, lon1, lat2, lon2){
    const toRad = d => d * Math.PI / 180;
    const toDeg = r => r * 180 / Math.PI;
    const φ1 = toRad(lat1), φ2 = toRad(lat2);
    const Δλ = toRad(lon2 - lon1);
    const y = Math.sin(Δλ) * Math.cos(φ2);
    const x = Math.cos(φ1)*Math.sin(φ2) - Math.sin(φ1)*Math.cos(φ2)*Math.cos(Δλ);
    return normalizeDeg(toDeg(Math.atan2(y,x)));
  }
  function getHeadingDeg(lat, lon, coords){
    let h = normalizeDeg(coords && coords.heading);
    if(h !== null){ lastHeadingDeg = h; return h; }

    if(lastGpsLat !== null && lastGpsLon !== null){
      const moveM = meters([lastGpsLat,lastGpsLon],[lat,lon]);
      if(moveM >= HEADING_MIN_MOVE_M){
        h = bearingDeg(lastGpsLat,lastGpsLon,lat,lon);
        if(h !== null){ lastHeadingDeg = h; return h; }
      }
    }
    return lastHeadingDeg;
  }

          pos=>resolve({
            lat: pos.coords.latitude,
            lon: pos.coords.longitude,
            acc: pos.coords.accuracy || 9999
          }),
          err=>reject(err),
          { enableHighAccuracy:true, maximumAge:0, timeout:timeoutMs }
        );
      });
    }

    try{
      for(let i=0;i<3;i++){
        try{
          const s = await oneShot(8000);
          samples.push(s);
          if(s.acc <= 10) break;
        }catch(_e){}
      }

      if(samples.length===0){
        throw new Error('位置を取得できませんでした。');
      }

      samples.sort((a,b)=>a.acc-b.acc);
      const best = samples[0];

      suppressFollow(0);
      ensureLocLayer(best.lat, best.lon, best.acc);
      map.setView([best.lat, best.lon], Math.max(map.getZoom(), 17));

      if(nav.active){
        let cur = nav.order[nav.idx];
        let currentPoint = nameIndex.get(cur);

        if(!currentPoint || currentPoint.status!=='normal'){
          const k = strictOrder.indexOf(cur);
          if(k>=0 && k+1 < strictOrder.length){
            nav.idx = k+1;
            cur = nav.order[nav.idx] = strictOrder[nav.idx];
            currentPoint = nameIndex.get(cur);
          }
        }
        if(currentPoint){
          autoCollectIfArrived(best.lat, best.lon, cur);
        }
      }

      showToast(`補正完了（精度 約${Math.round(best.acc)}m）`, 2.5);
    }catch(e){
      alert('位置補正に失敗しました。位置情報の許可や電波状況をご確認ください。');
      console.warn(e);
    }finally{
      btn.disabled = false;
      btn.textContent = oldText;
    }
  }

  let strictOrder=[];
  const nextDistByName = new Map();
  function meters(a,b){
    const dy=(a[0]-b[0])*111320;
    const dx=(a[1]-b[1])*111320*Math.cos((a[0]+b[0])*Math.PI/360);
    return Math.hypot(dx,dy);
  }

  function buildStrictOrderFromFirst(options){
    const silent = !!(options && options.silent);
    strictOrder=[];
    nextDistByName.clear();

    // Ver173: 地点CSV未読込時や読込途中に、状況表示更新だけで警告を出さない。
    if(points.length === 0){ return; }
    if(!firstLoadedName || !nameIndex.has(firstLoadedName)){
      if(!silent) alert('先頭行の Name が正しく読み込めていません。');
      return;
    }

    const visited=new Set();
    let cur = firstLoadedName;
    while(cur && !visited.has(cur)){
      const p = nameIndex.get(cur);
      if(!p){ if(!silent) alert('存在しない地点が参照されました: '+cur); break; }
      strictOrder.push(cur);
      visited.add(cur);
      if(!p.desc) break;
      if(!nameIndex.has(p.desc)){
        if(!silent) alert('Description が未定義の地点を参照しています: '+p.name+' → '+p.desc);
        break;
      }
      const nx = p.desc;
      const q = nameIndex.get(nx);
      const d = meters([p.lat,p.lon],[q.lat,q.lon]);
      nextDistByName.set(p.name, d);
      cur = nx;
    }
    strictOrder.forEach((nm,i)=>{ const p=nameIndex.get(nm); if(p){ p.seq=i+1; setPopupContent(p); }});
  }


  // ===== Ver173: 実車無効時の「コース一覧読上げ」 =====
  // ・ボタンは設定パネル外（音量-/音量+/設定の下）へ常時表示

  let courseReadActive = false;
  let courseReadIndex = parseInt(localStorage.getItem('courseReadIndex') || '0', 10);
  if(!Number.isFinite(courseReadIndex) || courseReadIndex < 0) courseReadIndex = 0;
  let courseReadDelayMs = parseInt(localStorage.getItem('courseReadDelayMs') || '3000', 10);
  if(!Number.isFinite(courseReadDelayMs)) courseReadDelayMs = 3000;
  courseReadDelayMs = Math.min(10000, Math.max(700, courseReadDelayMs));

  function waitMs(ms){ return new Promise(resolve=>setTimeout(resolve, ms)); }
  function saveCourseReadIndex(v){
    courseReadIndex = Math.max(0, v|0);
    localStorage.setItem('courseReadIndex', String(courseReadIndex));
  }
  function updateCourseReadStatus(){
    const st = document.getElementById('courseReadStatus');
    const orderLen = buildCourseReadOrder({silent:true}).length;
    const posText = orderLen ? (' / 次:' + Math.min(courseReadIndex + 1, orderLen) + '/' + orderLen) : '';
    if(st) st.textContent = '読上げ間隔：' + (courseReadDelayMs/1000).toFixed(1) + '秒' + posText;
    localStorage.setItem('courseReadDelayMs', String(courseReadDelayMs));
  }
  function updateCourseReadButton(){
    const b = document.getElementById('btnCourseRead');
    if(b) b.textContent = courseReadActive ? '読上げ停止' : 'コース一覧読上げ';
  }
  function stopCourseRead(){
    // 現在読上げ中の地点を中断した場合も、次回は「次の回収地点」から再開する
    courseReadActive = false;
    updateCourseReadButton();
    updateCourseReadStatus();
    stopBlink();
    try{ speechSynthesis.cancel(); }catch(_e){}
  }
  function buildCourseReadOrder(options){
    const silent = !!(options && options.silent);
    if(points.length === 0) return [];
    if(strictOrder.length===0) buildStrictOrderFromFirst({silent:silent});
    return strictOrder.length ? strictOrder.slice() : points.map(p=>p.name);
  }
  function resetCourseReadIndexIfNeeded(order){
    if(!order || !order.length){ saveCourseReadIndex(0); return; }
    if(courseReadIndex >= order.length) saveCourseReadIndex(0);
  }
  async function startCourseRead(){
    blurAllInputs();
    unlockAll();

    if(realMode){
      alert('「コース一覧読上げ」は、実車：無効のときだけ使用できます。');
      return;
    }
    if(points.length===0){ alert('地点がありません。'); return; }

    const order = buildCourseReadOrder({silent:false});
    if(!order.length){ alert('読み上げできる地点がありません。'); return; }
    resetCourseReadIndexIfNeeded(order);

    courseReadActive = true;
    updateCourseReadButton();
    updateCourseReadStatus();
    togglePanel(false);

    try{
      for(let i=courseReadIndex; i<order.length && courseReadActive; i++){
        const nm = order[i];
        const p = nameIndex.get(nm);
        // 読上げ停止ボタンを押した場合、次回はこの次の地点から再開する
        saveCourseReadIndex(Math.min(i + 1, order.length));
        updateCourseReadStatus();
        if(!p) continue;
        focusTarget(nm);
        await speakSafeAsync(getSpeakOf(p) + ' に向かってください。');
        if(i < order.length - 1 && courseReadActive) await waitMs(courseReadDelayMs);
      }
      if(courseReadActive){
        await speakSafeAsync('コース一覧の読み上げが終了しました。');
        saveCourseReadIndex(0);
      }
    }finally{
      courseReadActive = false;
      updateCourseReadButton();
      updateCourseReadStatus();
      stopBlink();
    }
  }

  document.getElementById('btnCourseRead').addEventListener('click', ()=>{

  let logRows=JSON.parse(localStorage.getItem('collectionLog')||'[]');

  function nowStamp(){
    const dt=new Date(); const pad=n=>String(n).padStart(2,'0');
    return `${dt.getFullYear()}/${pad(dt.getMonth()+1)}/${pad(dt.getDate())} ${pad(dt.getHours())}:${pad(dt.getMinutes())}:${pad(dt.getSeconds())}`;
  }

  function getWorkDateFromStamp(stamp){
    const s = String(stamp || '');
    const m = s.match(/^(\d{4})\/(\d{2})\/(\d{2})/);
    return m ? `${m[1]}-${m[2]}-${m[3]}` : '';
  }

  function makeRecordId(){
    return 'TRM-' + Date.now() + '-' + Math.floor(Math.random()*1000000);
  }

  function normalizeResultType(rt){
    const s = String(rt || '').trim();
    if(s === '無回収' || s === 'no_collect' || s === 'skip' || s === 'skipped' || s === 'yellow') return '無回収';
    if(s === '回収' || s === 'collected' || s === 'auto' || s === 'manual' || s === 'red') return '回収';
    return s || '回収';
  }

  function findLastLogIndexByPlace(place){
    for(let i=logRows.length-1; i>=0; i--){
      const r = logRows[i];
      if(Array.isArray(r) && String(r[1] ?? '') === String(place ?? '')) return i;
    }
    return -1;
  }

  function ensureLogRowRecordId(row){
    if(!Array.isArray(row)) return makeRecordId();
    if(!row[7]) row[7] = makeRecordId();
    return row[7];
  }


  function getNoteForPlace(place){
    const p = nameIndex.get(String(place ?? ''));
    if(!p) return '';
    return (p.note || p.remarks || p.remark || p.memo || '').toString().trim();
  }

  function updateLastLogResultType(place, resultType){
    const idx = findLastLogIndexByPlace(place);
    if(idx < 0) return false;
    const row = logRows[idx];
    row[6] = normalizeResultType(resultType);
    ensureLogRowRecordId(row);
    localStorage.setItem('collectionLog', JSON.stringify(logRows));

    if(!row[8]) row[8] = currentCourseName || '';
    row[9] = getNoteForPlace(row[1]) || row[9] || '';
    const payload = makeCollectionPayload(row, row[6]);
    payload.updateReason = 'status-toggle';
    sendRowToServer(payload).then(res=>{
      console.log('GAS結果区分更新OK:', res);
    }).catch(e=>{
      console.warn('GAS結果区分更新に失敗。未送信キューへ保存:', e);
      pendingRows.push(payload);
      savePendingRows();
      showToast('GAS送信失敗：結果区分更新を未送信保存しました', 3);
    });
    return true;
  }

  let pendingRows = JSON.parse(localStorage.getItem('collectionLogPending') || '[]');
  function savePendingRows(){
    localStorage.setItem('collectionLogPending', JSON.stringify(pendingRows));
  }

  function makeCollectionPayload(row, resultType){
    const stamp = row[0] ?? nowStamp();
    const rt = normalizeResultType(resultType || row[6] || '回収');
    const recordId = ensureLogRowRecordId(row);
    const noteText = getNoteForPlace(row[1]) || row[9] || '';

    return {
      recordId: recordId,
      appVersion: VERSION,
      deviceTime: stamp,
      workDate: getWorkDateFromStamp(stamp),
      courseName: currentCourseName || row[8] || '',
      course: currentCourseName || row[8] || '',
      place: row[1] ?? '',
      lat: row[2] ?? '',
      lon: row[3] ?? '',
      vehicle: row[4] ?? '',
      driver: row[5] ?? '',
      resultType: rt,
      source: realMode ? 'realMode' : 'manualMode',
      userAgent: navigator.userAgent || '',
      pageUrl: location.href || '',
      note: noteText,
      remarks: noteText,
      iconColor: rt === '無回収' ? 'yellow' : 'red'
    };
  }

  function pushLogRow(row, resultType='回収'){
    // 端末内にも従来どおり残します（通信圏外・送信失敗時の保険）
    const row2 = Array.isArray(row) ? row.slice() : [];
    const rt = normalizeResultType(resultType || row2[6] || '回収');
    row2[6] = rt;
    ensureLogRowRecordId(row2);
    if(!row2[8]) row2[8] = currentCourseName || '';
    row2[9] = getNoteForPlace(row2[1]) || row2[9] || '';

    logRows.push(row2);
    localStorage.setItem('collectionLog',JSON.stringify(logRows));

    // Ver174: センター監視に表示する最終回収地点・時刻を保存
    rememberHeartbeatCollection(row2, rt);

    const payload = makeCollectionPayload(row2, rt);
    sendRowToServer(payload).then(res=>{
      console.log('GAS一元保存OK:', res);
      sendHeartbeat('collection', true);
    }).catch(e=>{
      console.warn('GAS一元保存に失敗。未送信キューへ保存:', e);
      pendingRows.push(payload);
      savePendingRows();
      showToast('GAS送信失敗：端末内に未送信保存しました', 3);
    });
  }

  async function retryPendingRows(){
    if(!pendingRows.length) return;
    if(!GAS_ENDPOINT || !GAS_ENDPOINT.startsWith('https://')) return;
    const remain=[];
    let ok=0;
    for(const payload of pendingRows){
      try{
        await sendRowToServer(payload);
        ok++;
      }catch(e){
        remain.push(payload);
      }
    }
    pendingRows = remain;
    savePendingRows();
    if(ok>0) showToast(`未送信ログ ${ok} 件をGASへ再送しました`, 3);
  }

  async function collectSelected(){
    if(!confirm('本当に回収しますか？')){ clearSelection(); return; }
    if(selected.size===0) return;

    // Ver173: 実車有効時の現在地取得を例外安全化する。
    // 現在地マーカー・GPSの取得に失敗しても、緯度経度を空欄として
    // 必ず後続の回収記録およびGAS送信へ進む。
    let lat='', lon='';
    if(realMode){
      try{
        const quick = getLatLngFromLocMarker();
        if(Array.isArray(quick) && quick.length >= 2 &&
           Number.isFinite(Number(quick[0])) && Number.isFinite(Number(quick[1]))){
          lat = quick[0];
          lon = quick[1];
        }
      }catch(e){
        console.warn('現在地マーカーからの緯度経度取得に失敗しました。', e);
      }

      if(lat === '' || lon === ''){
        try{
          const latest = await getCurrentLatLng(3000);
          if(Array.isArray(latest) && latest.length >= 2 &&
             Number.isFinite(Number(latest[0])) && Number.isFinite(Number(latest[1]))){
            lat = latest[0];
            lon = latest[1];
          }
        }catch(e){
          console.warn('GPS現在地の取得に失敗しました。緯度経度を空欄で記録します。', e);
        }
      }
    }

    let done=0;
    const selectedNow = Array.from(selected);
    for(const nm of selectedNow){
      const p=nameIndex.get(nm);
      if(!p || p.status!=='normal') continue;
      const vehicle=vehicleSel.value; const driver=driverSel.value;
      pushLogRow([nowStamp(), p.name, lat, lon, vehicle, driver, '回収'], '回収');
      p.status='collected';
      p.marker.setIcon(redIcon);
      if(p.selRing){ map.removeLayer(p.selRing); p.selRing=null; }
      selected.delete(nm);
      done++;
    }
    if(done>0){
      if(realMode) chime();
      showToast(`${done} 件（回収）を記録しました`,2);
      updatePointCount();
      sendHeartbeat('point-status-collected', true);
    }
    refreshFab();

    if(done===1 && selectedNow.length===1){
      guideNextAfter(selectedNow[0]);
    }
  }
  function skipSelected(){
    if(selected.size===0) return;
    let done=0;
    const selectedNow = Array.from(selected);
    for(const nm of selectedNow){
      const p=nameIndex.get(nm);
      if(!p || p.status!=='normal') continue;
      p.status='skipped';
      try{ pushLogRow([nowStamp(), p.name, '', '', vehicleSel.value, driverSel.value, '無回収'], '無回収'); }catch(_e){}
      p.marker.setIcon(yellowIcon);
      if(p.selRing){ map.removeLayer(p.selRing); p.selRing=null; }
      selected.delete(nm);
      done++;

    if(done>0){
      showToast(`${done} 件を「無回収」にしました`,2);
      updatePointCount();
      sendHeartbeat('point-status-skipped', true);

    if(done===1 && selectedNow.length===1){
      guideNextAfter(selectedNow[0]);
    }
  }
  document.getElementById('btnFabCollect').addEventListener('click', collectSelected);
  document.getElementById('btnFabSkip').addEventListener('click',    skipSelected);

  function clearAllPoints(){
    const ok = confirm('回収地点・基本回収ルートのデータを消去しますか？'); if(!ok) return;
    stopBlink();
    points.forEach(p=>{ if(p.selRing) map.removeLayer(p.selRing); map.removeLayer(p.marker); });
    stopCourseRead();

    // Ver173: 「回収地点全クリア」で、地点CSVだけでなく基本回収ルート（赤線）も初期状態へ戻す。
    if(routeLayer){
      try{ map.removeLayer(routeLayer); }catch(_e){}

    points.length=0; nameIndex.clear(); strictOrder=[]; firstLoadedName=null; nextDistByName.clear();

  async function readFileAsArrayBuffer(file){
    return new Promise((resolve,reject)=>{
      const r=new FileReader();
      r.onload=()=>resolve(r.result);
      r.onerror=()=>reject(r.error||new Error('FileReader error'));
      r.readAsArrayBuffer(file);
    });
  }
  function decodeCsvBuffer(buf){
    try{
      const u8 = new TextDecoder('utf-8', {fatal:false}).decode(buf);
      const bad = (u8.match(/\uFFFD/g)||[]).length;
      const head = u8.slice(0,200);
      const looksOk = /Name\s*,\s*Latitude\s*,\s*Longitude/i.test(head);
      if(looksOk && bad < 5) return {text:u8, enc:'utf-8'};
    }catch(_e){}
    try{
      const sj = new TextDecoder('shift_jis', {fatal:false}).decode(buf);
      return {text:sj, enc:'shift_jis'};
    }catch(_e){
      const u8 = new TextDecoder('utf-8', {fatal:false}).decode(buf);
      return {text:u8, enc:'utf-8(weak)'};
    }
  }

    s = s.replace(/\.[^.]+$/,'');

  function importCSV(file){
    currentCourseName = deriveCourseNameFromFileName(file && file.name ? file.name : '');
    stopBlink();
    stopCourseRead();
      points.length=0; nameIndex.clear(); firstLoadedName=null; strictOrder=[]; nextDistByName.clear();

    readFileAsArrayBuffer(file).then(buf=>{
      const d = decodeCsvBuffer(buf);
      const csvText = d.text;

      Papa.parse(csvText,{
        header:true,
        skipEmptyLines:true,
        transformHeader:(h)=> String(h||'').replace(/^\uFEFF/,'').trim(),
        complete:(res)=>{
          try{
            const rows=res.data||[];

            const seen=new Set(), dups=new Set();
            for(const r of rows){
              const nm=(r.Name||r.name||r['名称']||r['タイトル']||r.title||r.id||'').toString().trim();
              if(!nm) continue;
              if(seen.has(nm)) dups.add(nm); else seen.add(nm);
            }
            if(dups.size>0){
              alert('地点の名称に重複があります。処理を中止します。\n重複: '+Array.from(dups).join(', '));
              return;
            }

            let added=0, speakCount=0;
            for(const r of rows){
              const name=(r.Name||r.name||r['名称']||r['タイトル']||r.title||r.id||'').toString().trim();
              const lat =parseFloat(r.Latitude||r.lat||r.Lat||r['緯度']);
              const lon =parseFloat(r.Longitude||r.lon||r.Lon||r.Lng||r['経度']);
              const desc=(r.Description||r.desc||r['説明']||'').toString().trim();
              const note=(r.Note||r.note||r['備考']||r.Remarks||r.remarks||r.Memo||r.memo||'').toString().trim();
              const speak=(r.Speak||r.speak||r['読み']||r['ヨミ']||r['Yomi']||'').toString().replace(/\u3000/g,' ').trim();

              if(name && Number.isFinite(lat)&&Number.isFinite(lon)){
                addPoint(name,lat,lon,desc,speak,note);
                if(speak) speakCount++;
                added++;
              }
            }

            if(added>0){
              buildStrictOrderFromFirst();
              map.fitBounds(L.latLngBounds(points.map(p=>[p.lat,p.lon])),{padding:[20,20]});
              updatePointCount();
              showToast(`${added} 点読込（${d.enc} / speak${speakCount} / コース:${currentCourseName || '未設定'}）`,2);
            }else{
              alert('有効な列(Name,Latitude,Longitude)が見つかりません');
            }
          }catch(e){ showErr(e); }
        },
        error:(e)=>showErr(e)
      });
    }).catch(showErr);
  }

  async function importOther(file){
    try{
      currentCourseName = deriveCourseNameFromFileName(file && file.name ? file.name : '');
      stopBlink();
      stopCourseRead();
      points.length=0; nameIndex.clear(); firstLoadedName=null; strictOrder=[]; nextDistByName.clear();
      const text=await file.text();
      if(file.name.toLowerCase().endsWith('.kml')){
        const nameRegex=/<name>([\s\S]*?)<\/name>/gi;
        const coordRegex=/<coordinates>([-0-9.]+),([-0-9.]+)/gi;
        const names=[]; let m;
        while((m=nameRegex.exec(text))){ names.push(m[1].trim()); }
        let i=0; while((m=coordRegex.exec(text))){
          const lon=parseFloat(m[1]); const lat=parseFloat(m[2]);
          const nm=(names[i]||'').toString().trim(); i++;
          if(nm && Number.isFinite(lat)&&Number.isFinite(lon)) addPoint(nm,lat,lon,'','');
        }
      }else if(file.name.toLowerCase().endsWith('.geojson')||file.name.toLowerCase().endsWith('.json')){
        const gj=JSON.parse(text);
        const feats=gj.type==='FeatureCollection'?gj.features:[];
        feats.forEach(f=>{
          if(f.geometry && f.geometry.type==='Point' && Array.isArray(f.geometry.coordinates)){
            const lon=f.geometry.coordinates[0], lat=f.geometry.coordinates[1];
            const nm=((f.properties&&(f.properties.Name||f.properties.name))||'').toString().trim();
            if(nm) addPoint(nm,lat,lon,'','');
          }
        });
      }
      if(points.length){
        buildStrictOrderFromFirst();
        map.fitBounds(L.latLngBounds(points.map(p=>[p.lat,p.lon])),{padding:[20,20]});
        updatePointCount();
      }
    }catch(e){ showErr(e); }
  }

  // Ver163で呼び出しだけ残っていた stopBlink/startBlinkFor を明示定義し、

  let blinkTimer = null;

  function stopBlink(){
    if(blinkTimer){
      clearInterval(blinkTimer);
      blinkTimer = null;
    }
    if(blinkIconEl){
      try{ blinkIconEl.classList.remove('blink-white'); }catch(_e){}
      blinkIconEl = null;
    }
  }

  function startBlinkFor(uniqueName){
    stopBlink();
    const p = nameIndex.get(uniqueName);
    if(!p || !p.marker) return;
    const el = (typeof p.marker.getElement === 'function') ? p.marker.getElement() : p.marker._icon;
    if(!el) return;
    blinkIconEl = el;
    let on = false;
    const tick = ()=>{
      if(!blinkIconEl) return;
      on = !on;
      blinkIconEl.classList.toggle('blink-white', on);
    };
    tick();
    blinkTimer = setInterval(tick, 350);
  }

  const nav={order:[],idx:0,active:false,watchId:null,thresholdM:25,arriveM:15,lastAnnounceTarget:null,farZoomM:100};

    const p=nameIndex.get(uniqueName); if(!p) return;

  function getMaxCollectedSeq(){
    let max = 0;
    for(const p of points){
      if(p && p.status==='collected' && typeof p.seq==='number'){

      }

  function buildResumeOptions(){
    const items=[];
    strictOrder.forEach((nm,idx)=>{
      const p=nameIndex.get(nm);
      if(!p) return;
      const seq = (typeof p.seq==='number') ? p.seq : (idx+1);
      let status='';
      if(p.status==='collected') status='済';
      else if(p.status==='skipped') status='無';
      const label = `#${seq} {${p.name}}${status ? ' ' + status : ''}`;
      items.push({seq,label});
    });
    return items;
  }

  function resumeGuidanceAtSeq(startSeq, options){
    const isRemote = !!(options && options.remote === true);

    blurAllInputs();
    unlockAll();

    if(points.length===0){
      return {ok:false, code:'NO_POINTS', message:'地点データが読み込まれていません。'};
    }
    if(strictOrder.length===0){
      return {ok:false, code:'NO_ROUTE_ORDER', message:'回収順序を確認できません。'};
    }

    rebuildOrderFromStrictChain();

    const seq = Number(startSeq);
    if(!Number.isFinite(seq) || seq < 1 || seq > strictOrder.length){
      return {
        ok:false,
        code:'INVALID_SEQUENCE',
        message:`再開地点番号が不正です。入力可能範囲は1～${strictOrder.length}です。`
      };
    }

    nav.idx = Math.floor(seq) - 1;
    nav.order = strictOrder.slice();

    const cur = nav.order[nav.idx];
    if(!cur || !nameIndex.has(cur)){
      return {ok:false, code:'POINT_NOT_FOUND', message:'指定された再開地点が見つかりません。'};
    }

    nav.active = true;
    togglePanel(false);
    speakSafe(`再開します。まずは ${getSpeakOf(cur)} に向かってください。`);
    nav.lastAnnounceTarget = cur;
    focusTarget(cur);

    if(realMode){
      if(nav.watchId) navigator.geolocation.clearWatch(nav.watchId);
      nav.watchId = navigator.geolocation.watchPosition(
        onPos,
        ()=>{},
        {enableHighAccuracy:true,maximumAge:0,timeout:15000}
      );
      if(!gpsWatchId) startGpsWatch();
    }

    if(isRemote){
      showToast(`センター指示：#${seq} ${cur} から再開しました`, 6);
    }

    return {
      ok:true,
      startSeq:seq,
      place:cur,
      message:`#${seq} ${cur} から再開しました。`
    };
  }

  function resumeGuidance(){
    if(points.length===0){ alert('地点がありません'); return; }
    if(strictOrder.length===0){
      alert('Description による鎖が見つかりません（先頭行から辿れませんでした）');

    });
  }

  let remoteCommandTimer = null;

  async function fetchRemoteCommand(){
    if(remoteCommandBusy || !GAS_ENDPOINT || !navigator.onLine) return;

    const deviceId = getHeartbeatDeviceId();
    if(!deviceId) return;

    remoteCommandBusy = true;
    try{
      const params = new URLSearchParams({
        action:'pollRemoteCommand',
        deviceId:deviceId,
        vehicle:String(vehicleSel.value || ''),
        t:String(Date.now())
      });
      const response = await fetch(`${GAS_ENDPOINT}?${params.toString()}`, {
        method:'GET',
        cache:'no-store'
      });
      if(!response.ok) throw new Error(`HTTP ${response.status}`);

      const data = await response.json();
      if(!data || !data.ok || !data.command) return;

      const command = data.command;
      const lastId = localStorage.getItem(REMOTE_COMMAND_LAST_ID_KEY) || '';
      if(lastId === String(command.commandId || '')){
        return;
      }

      const result = executeRemoteCommand(command);
      localStorage.setItem(REMOTE_COMMAND_LAST_ID_KEY, String(command.commandId || ''));
      await sendRemoteCommandAck(command, result);
    }catch(error){
      console.warn('遠隔指示の確認に失敗しました。', error);

  function executeRemoteCommand(command){
    try{
      const type = String(command.commandType || '').toLowerCase();

      if(type === 'pause'){
        const result = pauseGuidance({remote:true});
        return {
          ok:true,
          code:'PAUSED',
          message:result.message,
          maxCollectedSeq:result.maxCollectedSeq
        };
      }

      if(type === 'resume'){
        const realResult = setRealModeEnabled(true, {remote:true});
        if(!realResult.ok) return realResult;

        const resumeResult = resumeGuidanceAtSeq(
          Number(command.targetSeq),
          {remote:true}
        );

        if(resumeResult && resumeResult.ok){
          resumeResult.code = 'REAL_ON_AND_RESUMED';
          resumeResult.message =
            '実車を有効にし、' + resumeResult.message;
        }
        return resumeResult;
      }

      if(type === 'real_on'){
        const result = setRealModeEnabled(true, {remote:true});
        return {
          ok:result.ok,
          code:'REAL_MODE_ON',
          message:result.message
        };
      }

      if(type === 'real_off'){
        const result = setRealModeEnabled(false, {remote:true});
        return {
          ok:result.ok,
          code:'REAL_MODE_OFF',
          message:result.message
        };
      }

      if(type === 'gps_refresh'){
        try{
          startGpsWatch();
          return {
            ok:true,
            code:'GPS_REFRESH_STARTED',
            message:'GPSの再取得を開始しました。'
          };
        }catch(error){
          return {
            ok:false,
            code:'GPS_REFRESH_FAILED',
            message:String(error && error.message ? error.message : error)
          };
        }
      }

      return {
        ok:false,
        code:'UNKNOWN_COMMAND',
        message:'未対応の遠隔指示です。'
      };
    }catch(error){
      return {
        ok:false,
        code:'EXECUTION_ERROR',
        message:String(error && error.message ? error.message : error)
      };
    }
  }

  function normalizeSdp_(sdp){
    let text=String(sdp||'').replace(/\r\n/g,'\n').replace(/\r/g,'\n');
    text=text.split('\n').map(line=>line.trimEnd()).join('\r\n');
    return text.replace(/(?:\r\n)+$/g,'')+'\r\n';
  }
  function validateSdp_(sdp,label){
    const text=normalizeSdp_(sdp);
    const lines=text.split('\r\n').filter(Boolean);
    if(!lines.length||lines[0]!=='v=0') throw new Error((label||'SDP')+'の先頭行がv=0ではありません。');
    const invalid=lines.find(line=>!/^[a-z]=/i.test(line));
    if(invalid) throw new Error((label||'SDP')+'に不正な単独行があります：'+invalid.slice(0,120));
    return text;
  }
  function utf8ToBase64_(text){
    const bytes=new TextEncoder().encode(String(text||'')); let binary='';
    for(let i=0;i<bytes.length;i+=0x8000) binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
    return btoa(binary);
  }
  function base64ToUtf8_(base64){
    const clean=String(base64||'').replace(/\s+/g,'');
    if(!clean||!/^[A-Za-z0-9+/=]+$/.test(clean)) throw new Error('SDP Base64が空、または不正です。');
    const binary=atob(clean), bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    return new TextDecoder('utf-8',{fatal:true}).decode(bytes);
  }
  function encodeSdpBase64_(sdp,label){return utf8ToBase64_(validateSdp_(sdp,label));}
  function decodeSdpBase64_(base64,label){return validateSdp_(base64ToUtf8_(base64),label);}

  async function playAudioStandbyTestTone_(){
    const context = await ensureAudioUnlockContext_();
    const start = context.currentTime + 0.03;

    const master = context.createGain();
    master.gain.value = 0.85;
    master.connect(context.destination);

    [880,1175].forEach((frequency,index) => {
      const osc = context.createOscillator();
      const gain = context.createGain();
      const at = start + index * 0.32;

      osc.type = 'square';
      osc.frequency.value = frequency;
      gain.gain.setValueAtTime(0.0001, at);
      gain.gain.exponentialRampToValueAtTime(0.7, at + 0.015);
      gain.gain.setValueAtTime(0.7, at + 0.18);
      gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.24);

      osc.connect(gain);
      gain.connect(master);
      osc.start(at);
      osc.stop(at + 0.27);
    });

    await sleepAudio_(800);

  function waitIceComplete(peer, timeoutMs){
    return new Promise(resolve => {
      if(peer.iceGatheringState === 'complete') return resolve();
      const timer = setTimeout(done, timeoutMs || 8000);
      function done(){
        clearTimeout(timer);
        peer.removeEventListener('icegatheringstatechange', check);
        resolve();
      }
      function check(){
        if(peer.iceGatheringState === 'complete') done();
      }
      peer.addEventListener('icegatheringstatechange', check);
    });
  }

  function createVoiceDetector_(stream, callId){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) throw new Error('AudioContextを利用できません。');

    const tracks = stream && stream.getAudioTracks ? stream.getAudioTracks() : [];
    fireAudioTrace_(
      'DRIVER_VOICE_DETECTOR_CREATE',
      callId,
      '音声検知器を作成',
      {
        trackCount:tracks.length,
        tracks:tracks.map(track => ({
          id:String(track.id || ''),
          label:String(track.label || ''),
          enabled:Boolean(track.enabled),
          muted:Boolean(track.muted),
          readyState:String(track.readyState || ''),
          settings:track.getSettings ? track.getSettings() : {}
        }))
      }
    );

    const context = new Ctx();
    const source = context.createMediaStreamSource(stream);
    const analyser = context.createAnalyser();
    analyser.fftSize = 1024;
    analyser.smoothingTimeConstant = 0.25;
    source.connect(analyser);

    fireAudioTrace_(
      'DRIVER_VOICE_AUDIO_CONTEXT',
      callId,
      'AudioContext・Analyser準備完了',
      {
        contextState:String(context.state || ''),
        sampleRate:Number(context.sampleRate || 0),
        fftSize:Number(analyser.fftSize || 0),
        smoothingTimeConstant:Number(analyser.smoothingTimeConstant || 0)
      }
    );

    const data = new Float32Array(analyser.fftSize);

    return {
      context,
      tracks,
      getRms(){
        analyser.getFloatTimeDomainData(data);
        let sum = 0;
        for(let i=0;i<data.length;i++) sum += data[i] * data[i];
        return Math.sqrt(sum / data.length);
      },
      async close(){
        fireAudioTrace_(
          'DRIVER_VOICE_DETECTOR_CLOSE',
          callId,
          '音声検知器を終了',
          {contextState:String(context.state || '')}
        );
        try{ source.disconnect(); }catch(_e){}
        try{ analyser.disconnect(); }catch(_e){}
        try{ await context.close(); }catch(_e){}
      }
    };
  }

  async function calibrateVoiceThreshold_(detector, callId){
    const samples = [];
    const until = Date.now() + 700;

    fireAudioTrace_(
      'DRIVER_VOICE_CALIBRATION_START',
      callId,
      '周囲音の基準値測定を開始',
      {durationMs:700, minimumThreshold:AUDIO_MIN_VOICE_RMS}
    );

    while(Date.now() < until){
      samples.push(detector.getRms());
      await sleepAudio_(70);
    }

    const sorted = samples.slice().sort((a,b)=>a-b);
    const median = sorted.length ? sorted[Math.floor(sorted.length / 2)] : 0;
    const minimum = sorted.length ? sorted[0] : 0;
    const maximum = sorted.length ? sorted[sorted.length - 1] : 0;
    const average = samples.length
      ? samples.reduce((sum,value)=>sum+value,0) / samples.length
      : 0;
    const threshold = Math.max(AUDIO_MIN_VOICE_RMS, median * 3.2);

    fireAudioTrace_(
      'DRIVER_VOICE_CALIBRATION_RESULT',
      callId,
      '周囲音の基準値測定完了',
      {
        sampleCount:samples.length,
        minimum:minimum,
        maximum:maximum,
        average:average,
        median:median,
        multiplier:3.2,
        minimumThreshold:AUDIO_MIN_VOICE_RMS,
        decidedThreshold:threshold,
        samples:samples
      }
    );

    return threshold;
  }

        ringOnMs:AUDIO_RING_ON_MS,
        listenMs:AUDIO_LISTEN_MS,
        frameMs:AUDIO_VOICE_FRAME_MS,
        requiredFrames:AUDIO_VOICE_REQUIRED_FRAMES,
        minimumVoiceRms:AUDIO_MIN_VOICE_RMS
      }
    );

    try{
      detector = createVoiceDetector_(stream, callId);

      if(detector.context && detector.context.state === 'suspended'){
        fireAudioTrace_(
          'DRIVER_VOICE_CONTEXT_RESUME_REQUEST',
          callId,
          'AudioContext再開を要求',
          {beforeState:String(detector.context.state || '')}
        );
        try{
          await detector.context.resume();
          fireAudioTrace_(
            'DRIVER_VOICE_CONTEXT_RESUME_RESULT',
            callId,
            'AudioContext再開結果',
            {afterState:String(detector.context.state || '')}
          );
        }catch(error){
          fireAudioTrace_(
            'DRIVER_VOICE_CONTEXT_RESUME_ERROR',
            callId,
            'AudioContext再開失敗',
            {
              name:String(error && error.name || ''),
              message:String(error && error.message || error)
            }
          );
        }
      }

      threshold = await calibrateVoiceThreshold_(detector, callId);

      await postAudioSignal({
        action:'status',
        callId:callId,
        status:'RINGING',
        message:'端末で大音量呼出を開始'
      });

      while(
        !audioRingStopped &&
        activeAudioCallId === callId &&
        Date.now() - startedAt < AUDIO_RING_TIMEOUT_MS
      ){
        listenCycle++;

        fireAudioTrace_(
          'DRIVER_VOICE_RING_CYCLE_START',
          callId,
          '呼び出し・音声待機サイクル開始',
          {
            cycle:listenCycle,
            elapsedMs:Date.now()-startedAt,
            threshold:threshold,
            contextState:String(detector.context && detector.context.state || '')
          }
        );

        showToast('センターから呼び出しです。声を出してください', 4);

        fireAudioTrace_(
          'RING_FIRST_ALARM_START',
          callId,
          '大音量呼出を最優先で開始',
          {
            cycle:listenCycle,
            elapsedMs:Date.now()-startedAt,
            ringContextState:String(audioRingContext && audioRingContext.state || '')
          }
        );

        try{
          await playIncomingAlarmBurst_();
          fireAudioTrace_(
            'RING_FIRST_ALARM_SUCCESS',
            callId,
            '大音量呼出の再生完了',
            {cycle:listenCycle,elapsedMs:Date.now()-startedAt}
          );
        }catch(error){
          fireAudioTrace_(
            'RING_FIRST_ALARM_ERROR',
            callId,
            '大音量呼出の再生失敗',
            {
              cycle:listenCycle,
              name:String(error && error.name || ''),
              message:String(error && error.message || error),
              stack:String(error && error.stack || '').slice(0,1200)
            }
          );
          throw error;
        }

        fireAudioTrace_(
          'DRIVER_VOICE_ALARM_BURST_END',
          callId,
          '大音量呼出区間が終了',
          {cycle:listenCycle,elapsedMs:Date.now()-startedAt}
        );

        if(audioRingStopped || activeAudioCallId !== callId){
          fireAudioTrace_(
            'DRIVER_VOICE_CANCELLED_AFTER_ALARM',
            callId,
            '呼出音後に検知処理が中止',
            {
              cycle:listenCycle,
              audioRingStopped:Boolean(audioRingStopped),
              activeAudioCallId:String(activeAudioCallId || '')
            }
          );
          return false;
        }

        speakIncomingPrompt_();

        await sleepAudio_(900);

        await postAudioSignal({
          action:'status',
          callId:callId,
          status:'VOICE_WAIT',
          message:'ドライバーの発声を待っています'
        });

        const listenStartedAt = Date.now();
        const listenUntil = listenStartedAt + AUDIO_LISTEN_MS;
        voiceFrames = 0;
        let sampleCount = 0;
        let aboveCount = 0;
        let cyclePeak = 0;
        let cycleSum = 0;
        const frameSamples = [];

        fireAudioTrace_(
          'DRIVER_VOICE_LISTEN_START',
          callId,
          'マイク音量判定区間を開始',
          {
            cycle:listenCycle,
            threshold:threshold,
            requiredFrames:AUDIO_VOICE_REQUIRED_FRAMES,
            listenMs:AUDIO_LISTEN_MS
          }
        );

        while(
          Date.now() < listenUntil &&
          !audioRingStopped &&
          activeAudioCallId === callId
        ){
          const rms = detector.getRms();
          sampleCount++;
          cycleSum += rms;
          cyclePeak = Math.max(cyclePeak, rms);
          overallPeak = Math.max(overallPeak, rms);

          const above = rms >= threshold;
          if(above){
            aboveCount++;
            voiceFrames++;
          }else{
            voiceFrames = Math.max(0, voiceFrames - 1);
          }

          frameSamples.push({
            ms:Date.now()-listenStartedAt,
            rms:rms,
            above:above,
            voiceFrames:voiceFrames
          });

          if(voiceFrames >= AUDIO_VOICE_REQUIRED_FRAMES){
            stopIncomingAlarm_();

            fireAudioTrace_(
              'DRIVER_VOICE_DETECTED',
              callId,
              'ドライバー音声を検知',
              {
                cycle:listenCycle,
                threshold:threshold,
                detectedRms:rms,
                cyclePeak:cyclePeak,
                overallPeak:overallPeak,
                sampleCount:sampleCount,
                aboveCount:aboveCount,
                requiredFrames:AUDIO_VOICE_REQUIRED_FRAMES,
                frameSamples:frameSamples
              }
            );

            await postAudioSignal({
              action:'status',
              callId:callId,
              status:'VOICE_DETECTED',
              message:'ドライバーの音声を検知。自動応答します'
            });

            showToast('音声を確認しました。センターへ接続します', 5);
            return true;
          }

          await sleepAudio_(AUDIO_VOICE_FRAME_MS);
        }

        fireAudioTrace_(
          'DRIVER_VOICE_LISTEN_END',
          callId,
          '今回のマイク音量判定区間では検知なし',
          {
            cycle:listenCycle,
            threshold:threshold,
            sampleCount:sampleCount,
            aboveCount:aboveCount,
            finalVoiceFrames:voiceFrames,
            cycleMinimum:frameSamples.length
              ? Math.min(...frameSamples.map(row=>row.rms)) : 0,
            cycleAverage:sampleCount ? cycleSum/sampleCount : 0,
            cyclePeak:cyclePeak,
            overallPeak:overallPeak,
            contextState:String(detector.context && detector.context.state || ''),
            tracks:detector.tracks.map(track => ({
              enabled:Boolean(track.enabled),
              muted:Boolean(track.muted),
              readyState:String(track.readyState || '')
            })),
            frameSamples:frameSamples
          }
        );

        await sleepAudio_(250);
      }

      fireAudioTrace_(
        'DRIVER_VOICE_TIMEOUT',
        callId,
        '35秒以内に規定音量を連続検知できず終了',
        {
          elapsedMs:Date.now()-startedAt,
          cycles:listenCycle,
          threshold:threshold,
          overallPeak:overallPeak,
          audioRingStopped:Boolean(audioRingStopped),
          activeAudioCallId:String(activeAudioCallId || '')
        }
      );

      return false;
    }catch(error){
      fireAudioTrace_(
        'DRIVER_VOICE_EXCEPTION',
        callId,
        '音声検知処理で例外',
        {
          name:String(error && error.name || ''),
          message:String(error && error.message || error),
          stack:String(error && error.stack || '').slice(0,1500),
          elapsedMs:Date.now()-startedAt,
          threshold:threshold,
          overallPeak:overallPeak
        }
      );
      throw error;
    }finally{
      if(detector) await detector.close();
    }
  }

  async function answerAudioCall(call){
    await closeDeviceAudioCall('new-call', false);
    activeAudioCallId = String(call.callId);
    audioRingStopped = false;
    await acquireAudioWakeLock_();

    let audioStage = '着信受付';

    try{
      audioStage = 'マイク取得';
      fireAudioTrace_(
        'DRIVER_VOICE_GET_USER_MEDIA_REQUEST',
        activeAudioCallId,
        'マイク取得を要求',
        {
          constraints:{
            echoCancellation:true,
            noiseSuppression:true,
            autoGainControl:true
          }
        }
      );

      audioLocalStream = await navigator.mediaDevices.getUserMedia({
        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        },
        video:false
      });

      fireAudioTrace_(
        'DRIVER_VOICE_GET_USER_MEDIA_SUCCESS',
        activeAudioCallId,
        'マイク取得成功',
        {
          active:Boolean(audioLocalStream.active),
          audioTrackCount:audioLocalStream.getAudioTracks().length,
          tracks:audioLocalStream.getAudioTracks().map(track => ({
            id:String(track.id || ''),
            label:String(track.label || ''),
            enabled:Boolean(track.enabled),
            muted:Boolean(track.muted),
            readyState:String(track.readyState || ''),
            settings:track.getSettings ? track.getSettings() : {},
            constraints:track.getConstraints ? track.getConstraints() : {}
          }))
        }
      );

      audioStage = '大音量呼出・音声検知';
      const voiceDetected = await waitForDriverVoice_(
        audioLocalStream,
        activeAudioCallId
      );

      if(!voiceDetected){
        const noAnswerId = activeAudioCallId;

        stopIncomingAlarm_();
        showToast('応答する声を確認できませんでした', 7);

        await postAudioSignal({
          action:'status',
          callId:noAnswerId,
          status:'NO_ANSWER',
          message:'35秒以内にドライバーの音声を検知できませんでした'
        });

        await closeDeviceAudioCall('no-answer', false);
        return;
      }

      audioStage = 'PeerConnection作成';
      fireAudioTrace_('DRIVER_WEBRTC_PEER_CREATE_START', activeAudioCallId,
        'RTCPeerConnection作成開始', {iceServers:Array.isArray(call.iceServers) && call.iceServers.length ? call.iceServers : AUDIO_ICE_SERVERS});

      audioPeer = new RTCPeerConnection({
        iceServers:Array.isArray(call.iceServers) && call.iceServers.length
          ? call.iceServers : AUDIO_ICE_SERVERS
      });

      fireAudioTrace_('DRIVER_WEBRTC_PEER_CREATE_SUCCESS', activeAudioCallId,
        'RTCPeerConnection作成成功', {
          signalingState:String(audioPeer.signalingState||''),
          iceGatheringState:String(audioPeer.iceGatheringState||''),
          iceConnectionState:String(audioPeer.iceConnectionState||''),
          connectionState:String(audioPeer.connectionState||'')
        });

      audioPeer.onsignalingstatechange = () => audioPeer && fireAudioTrace_(
        'DRIVER_WEBRTC_SIGNALING_STATE', activeAudioCallId, 'signalingState変更',
        {state:String(audioPeer.signalingState||'')});
      audioPeer.onicegatheringstatechange = () => audioPeer && fireAudioTrace_(
        'DRIVER_WEBRTC_ICE_GATHERING_STATE', activeAudioCallId, 'iceGatheringState変更',
        {state:String(audioPeer.iceGatheringState||'')});
      audioPeer.oniceconnectionstatechange = () => audioPeer && fireAudioTrace_(
        'DRIVER_WEBRTC_ICE_CONNECTION_STATE', activeAudioCallId, 'iceConnectionState変更',
        {state:String(audioPeer.iceConnectionState||'')});
      audioPeer.onicecandidate = event => fireAudioTrace_(
        'DRIVER_WEBRTC_ICE_CANDIDATE', activeAudioCallId,
        event && event.candidate ? 'ICE候補取得' : 'ICE候補収集完了',
        {hasCandidate:Boolean(event&&event.candidate), candidate:event&&event.candidate ? String(event.candidate.candidate||'') : ''});

      audioStage = 'マイクトラック追加';
      audioLocalStream.getTracks().forEach(track => {
        audioPeer.addTrack(track, audioLocalStream);
      });
      fireAudioTrace_('DRIVER_WEBRTC_TRACKS_ADDED', activeAudioCallId,
        'マイクトラック追加完了', {trackCount:audioLocalStream.getTracks().length});

      audioPeer.ontrack = event => {
        const audio = ensureRemoteCenterAudio();
        audio.srcObject = event.streams[0];
        audio.play().catch(error => {
          console.warn('センター音声再生エラー', error);
          showToast(
            'センター音声の再生に失敗しました：' +
            String(error && error.message ? error.message : error),
            8
          );
        });
      };

      audioPeer.onconnectionstatechange = () => {
        if(!audioPeer) return;
        const state = String(audioPeer.connectionState || '');
        fireAudioTrace_('DRIVER_WEBRTC_CONNECTION_STATE', activeAudioCallId,
          'connectionState変更', {
            state:state,
            signalingState:String(audioPeer.signalingState||''),
            iceGatheringState:String(audioPeer.iceGatheringState||''),
            iceConnectionState:String(audioPeer.iceConnectionState||'')
          });

        if(state === 'connected'){
          showToast('センターと音声通話中です', 5);
          postAudioSignal({
            action:'status',
            callId:activeAudioCallId,
            status:'CONNECTED',
            message:'端末接続完了'
          });
        }else if(state === 'failed'){
          const message = '接続状態：failed';
          showToast('音声通話接続エラー：' + message, 8);
          postAudioSignal({
            action:'status',
            callId:activeAudioCallId,
            status:'FAILED',
            message:'接続監視段階｜' + message
          });
        }
      };

      audioStage = 'Offer Base64復号・検査';
      fireAudioTrace_('DRIVER_WEBRTC_OFFER_DECODE_START', activeAudioCallId,
        'Offer Base64復号開始', {offerBase64Length:String(call.offerSdpBase64||'').length});
      const decodedOfferSdp = decodeSdpBase64_(call.offerSdpBase64, 'Offer SDP');
      fireAudioTrace_('DRIVER_WEBRTC_OFFER_DECODE_SUCCESS', activeAudioCallId,
        'Offer Base64復号成功', {offerSdpLength:decodedOfferSdp.length, firstLine:decodedOfferSdp.split(/\r?\n/)[0]||''});

      audioStage = 'Offer設定';
      fireAudioTrace_('DRIVER_WEBRTC_SET_REMOTE_START', activeAudioCallId,
        'setRemoteDescription開始', {offerSdpLength:decodedOfferSdp.length});
      await audioPeer.setRemoteDescription({type:'offer', sdp:decodedOfferSdp});
      fireAudioTrace_('DRIVER_WEBRTC_SET_REMOTE_SUCCESS', activeAudioCallId,
        'setRemoteDescription成功', {signalingState:String(audioPeer.signalingState||'')});

      audioStage = 'Answer作成';
      fireAudioTrace_('DRIVER_WEBRTC_CREATE_ANSWER_START', activeAudioCallId,
        'createAnswer開始', {signalingState:String(audioPeer.signalingState||'')});
      const answer = await audioPeer.createAnswer();
      fireAudioTrace_('DRIVER_WEBRTC_CREATE_ANSWER_SUCCESS', activeAudioCallId,
        'createAnswer成功', {answerSdpLength:String(answer&&answer.sdp||'').length});

      audioStage = 'Answerローカル設定';
      fireAudioTrace_('DRIVER_WEBRTC_SET_LOCAL_START', activeAudioCallId,
        'setLocalDescription開始', {answerSdpLength:String(answer&&answer.sdp||'').length});
      await audioPeer.setLocalDescription(answer);
      fireAudioTrace_('DRIVER_WEBRTC_SET_LOCAL_SUCCESS', activeAudioCallId,
        'setLocalDescription成功', {signalingState:String(audioPeer.signalingState||''), iceGatheringState:String(audioPeer.iceGatheringState||'')});

      audioStage = 'ICE候補収集';
      fireAudioTrace_('DRIVER_WEBRTC_ICE_WAIT_START', activeAudioCallId,
        'ICE候補収集待機開始', {timeoutMs:8000});
      await waitIceComplete(audioPeer, 8000);
      fireAudioTrace_('DRIVER_WEBRTC_ICE_WAIT_END', activeAudioCallId,
        'ICE候補収集待機終了', {iceGatheringState:String(audioPeer.iceGatheringState||'')});

      audioStage = 'Answer Base64変換';
      const localAnswerSdp=String(audioPeer.localDescription&&audioPeer.localDescription.sdp||'');
      const answerSdpBase64 = encodeSdpBase64_(localAnswerSdp, 'Answer SDP');
      fireAudioTrace_('DRIVER_WEBRTC_ANSWER_ENCODED', activeAudioCallId,
        'Answer Base64変換完了', {answerSdpLength:localAnswerSdp.length, answerBase64Length:answerSdpBase64.length});

      audioStage = 'Answer送信';
      fireAudioTrace_('DRIVER_WEBRTC_ANSWER_SEND_START', activeAudioCallId,
        'Answer送信開始', {answerBase64Length:answerSdpBase64.length});
      await postAudioSignal({
        action:'answer',
        callId:activeAudioCallId,
        answerSdpBase64:answerSdpBase64,
        sdpEncoding:'utf8-base64',
        status:'ANSWERED',
        message:'音声検知による自動応答完了（SDP Base64保護）'
      });
      fireAudioTrace_('DRIVER_WEBRTC_ANSWER_SEND_SUCCESS', activeAudioCallId,
        'Answer送信成功', {answerBase64Length:answerSdpBase64.length});

      showToast('センターへ応答しました。接続中です', 5);
    }catch(error){
      const errorName = String(error && error.name ? error.name : 'Error');
      const errorMessage = String(error && error.message ? error.message : error);
      const detail = audioStage + '段階｜' + errorName + '｜' + errorMessage;
      const failedCallId = activeAudioCallId;
      fireAudioTrace_('DRIVER_WEBRTC_EXCEPTION', failedCallId,
        '自動応答・WebRTC処理で例外', {
          stage:String(audioStage||''), name:errorName, message:errorMessage,
          stack:String(error&&error.stack||'').slice(0,1800),
          signalingState:audioPeer?String(audioPeer.signalingState||''):'',
          iceGatheringState:audioPeer?String(audioPeer.iceGatheringState||''):'',
          iceConnectionState:audioPeer?String(audioPeer.iceConnectionState||''):'',
          connectionState:audioPeer?String(audioPeer.connectionState||''):''
        });

      stopIncomingAlarm_();
      console.error('端末側音声応答エラー', detail, error);
      showToast('音声通話エラー：' + detail, 12);

      try{
        await postAudioSignal({
          action:'status',
          callId:failedCallId,
          status:'FAILED',
          message:detail
        });
      }catch(postError){
        console.error('音声エラー詳細の送信失敗', postError);
      }

      await closeDeviceAudioCall('failed', false);
    }
  }

  async function closeDeviceAudioCall(reason, notifyServer = true){
    const oldId = activeAudioCallId;
    activeAudioCallId = '';
    stopIncomingAlarm_();
    await releaseAudioWakeLock_();

    if(audioPeer){
      try{ audioPeer.close(); }catch(_e){}
      audioPeer = null;
    }
    if(audioLocalStream){
      audioLocalStream.getTracks().forEach(track => track.stop());
      audioLocalStream = null;
    }
    if(remoteCenterAudio){
      try{ remoteCenterAudio.pause(); }catch(_e){}
      remoteCenterAudio.srcObject = null;
    }

    if(oldId && reason !== 'new-call' && notifyServer){
      try{
        await postAudioSignal({
          action:'hangup',
          callId:oldId,
          status:'ENDED',
          message:'端末側終了: ' + reason
        });
      }catch(_e){}
    }
  }
